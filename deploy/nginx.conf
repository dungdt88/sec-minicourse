# Static server for the built app (Lightsail: Caddy terminates TLS and proxies to this).
# __SUPABASE_ORIGIN__ is filled in at image build time from VITE_SUPABASE_URL (see Dockerfile).
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Health check for Docker and the deploy workflow; no headers, no logs.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite's hashed bundles and fonts never change under the same name: cache for a year.
    location ~ "^/assets/.+-[A-Za-z0-9_-]{8}\.[a-z0-9]+$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Other files under /assets (artwork the content names, added without a hash): a missing file
    # is a 404, never the app page.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Everything else is the single-page app: real files as they are, any other path gets
    # index.html (as vercel.json's rewrite did). index.html is revalidated, so a deploy shows at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
