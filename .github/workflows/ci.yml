name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate-content
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  # The e2e acceptance suite (pnpm test:e2e) needs Docker + the Supabase CLI and is run by hand
  # before a release; see README.
